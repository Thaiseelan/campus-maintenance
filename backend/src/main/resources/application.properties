# ===== Server =====
server.port=8080

# ===== Database (fill in your local PostgreSQL credentials) =====
spring.datasource.url=jdbc:postgresql://localhost:5432/campus_maintenance
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
# 'update' is fine while the schema is still moving; switch to 'validate'
# once you're confident the entities won't change, and use a migration
# tool (Flyway) instead if your course expects proper migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===== JWT =====
# Replace with a long random secret (32+ chars). Never commit the real value -
# move it to an environment variable before pushing to GitHub.
app.jwt.secret=REPLACE_WITH_A_LONG_RANDOM_SECRET_AT_LEAST_256_BITS
app.jwt.expiration-ms=86400000

# ===== Mail (needed for Phase 7 - notifications) =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_gmail_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== File upload (complaint / completion photos) =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads

# ===== Bootstrap admin =====
# Seeded automatically on first startup (see DataSeeder) since there's no
# self-registration path for admins. Change the password before any real use.
app.admin.name=Campus Admin
app.admin.email=admin@bitsathy.ac.in
app.admin.password=ChangeThisPassword123
