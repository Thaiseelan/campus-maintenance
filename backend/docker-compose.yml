services:
  postgres:
    image: postgres:16-alpine
    container_name: campus-maintenance-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus_maintenance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - campus_maintenance_data:/var/lib/postgresql/data

volumes:
  campus_maintenance_data:
